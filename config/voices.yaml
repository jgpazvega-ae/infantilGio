# Configuración de voces de ElevenLabs.
# El narrador es obligatorio; los personajes son opcionales (la arquitectura
# los soporta aunque no se usen en la primera fase).
#
# El voice_id se puede sobrescribir con la variable de entorno
# ELEVENLABS_VOICE_ID (tiene prioridad sobre 'narrator.voice_id').

# Modelo de TTS. eleven_multilingual_v2 soporta español con buena calidad.
model_id: eleven_multilingual_v2
output_format: mp3_44100_128   # 44.1 kHz, 128 kbps
# Límite de caracteres por petición (troceo de textos largos).
max_chars_per_request: 2500

narrator:
  # EsmeSu: femenina, español MEXICANO (es-MX), tono suave y cálido,
  # narración lenta y envolvente, tierna para cuentos antes de dormir.
  voice_id: KK9axBTGPbfqW7PU48BE
  language: es-MX
  # Ajustes más calmados y tiernos (mayor estabilidad, ritmo pausado).
  settings:
    stability: 0.85
    similarity_boost: 0.80
    style: 0.0
    use_speaker_boost: true
    speed: 0.90

# Voces alternativas calmadas/tiernas en ESPAÑOL MEXICANO (es-MX):
#   EsmeSu   (femenina, suave, lenta)     : KK9axBTGPbfqW7PU48BE  [por defecto]
#   Aurelio  (masculina, gentil y tierna) : PHNjiQZ95SnMQ7rDQsXz
#   Fernanda (femenina, cálida, natural)  : NyQ87MpRGbszyh7rZLXM
#   Camila   (femenina joven, cálida)     : spPXlKT5a4JMfbhPRAzA
# Otras (no mexicanas) cálidas:
#   Sofia (femenina, es-ES)               : pN4aFdNIp2mvGfTwy1Oj

# Personajes (opcional). Cada uno con su propio voice_id y ajustes.
characters: {}
  # ejemplo:
  # raton_timido:
  #   voice_id: XXXXXXXXXXXXXXXXXXXX
  #   settings:
  #     stability: 0.5
  #     similarity_boost: 0.75
