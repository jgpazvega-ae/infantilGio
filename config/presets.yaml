# Presets de salida y de audio reutilizados por todo el pipeline.

# Formato de video estándar para YouTube.
video:
  width: 1920
  height: 1080
  fps: 30
  video_codec: libx264
  audio_codec: aac
  audio_bitrate: 256k
  pixel_format: yuv420p
  preset: medium          # equilibrio calidad/velocidad de x264
  container: mp4

# Mezcla de audio (modificable).
audio:
  narration_volume: 1.0   # narración al 100%
  ambient_volume: 0.18    # ambiente al ~18% (rango recomendado 15-20%)

# Loops (dormir/relajación).
loop:
  # Duración del crossfade (segundos) para loops suaves sin clicks.
  crossfade_seconds: 2
  # Duración objetivo por defecto (5 h 55 min).
  default_duration: "05:55:00"

# Duraciones habituales soportadas (referencia; se acepta cualquiera).
common_durations:
  - "01:00:00"
  - "02:00:00"
  - "03:00:00"
  - "04:00:00"
  - "05:00:00"
  - "05:55:00"

# Presets de video de dormir (visual procedural). Valores 0..1 salvo indicado.
# Prioridad: relajación > espectacularidad. Movimiento casi imperceptible.
sleep:
  ocean_night:
    description: "Mar nocturno, pantalla oscura, movimiento mínimo e hipnótico."
    brightness: 0.08          # muy oscuro (nocturno)
    saturation: 0.35
    contrast: 0.85
    motion_speed: 0.10        # 0=estático, 1=rápido (aquí lentísimo)
    bubble_density: 0.08      # burbujas: pocas, grandes, lentas
    particle_density: 0.05    # grano/partículas extremadamente sutiles
    transition_duration: 8    # crossfade del loop (s)
    moon: true                # tenue resplandor lunar
  black_screen:
    description: "Pantalla casi negra; solo el sonido."
    brightness: 0.0
    saturation: 0.0
    contrast: 1.0
    motion_speed: 0.0
    bubble_density: 0.0
    particle_density: 0.0
    transition_duration: 4
    moon: false
  ocean_bubbles:
    description: "Mar nocturno con más burbujas suaves ascendentes."
    brightness: 0.10
    saturation: 0.40
    contrast: 0.85
    motion_speed: 0.12
    bubble_density: 0.18
    particle_density: 0.06
    transition_duration: 8
    moon: true

  # Arquitectura preparada para presets futuros (aún no implementados a nivel
  # visual, pero reconocibles por el motor): rain_dark, forest_dark,
  # stars_dark, cloud_dark.
  _future: [rain_dark, forest_dark, stars_dark, cloud_dark]
